name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - run: npm ci
    - run: npm run typecheck
    - run: npm run lint
    - run: npm test
    - run: PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" node scripts/with-app-env.mjs vite build
      env:
        VITE_PUBLIC_HOSTNAME: "dummy.grok.me"
