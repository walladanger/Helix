name: Helix Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/helix-desktop-installer"]
    paths:
      - "desktop-shell/**"
      - "src-tauri/**"
      - "scripts/build-desktop-server.mjs"
      - "scripts/prepare-desktop-sidecar.mjs"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-installer.yml"

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run desktop:installer
      - uses: actions/upload-artifact@v4
        with:
          name: Helix-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
